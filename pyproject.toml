[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "forge"
version = "0.1.0"
description = "A Python backend for infrastructure monitoring and automation."
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi[standard]>=0.115,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.9,<3.0",
    "pytest>=8.3,<10",
    "ruff>=0.12,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]